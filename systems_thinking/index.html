        <div className="min-h-screen flex flex-col pb-20">
          {/* Header */}
          <header className="border-b border-white/5 bg-[#0d1220] sticky top-0 z-30 px-6 py-3">
            <div className="max-w-[1600px] mx-auto flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-8 h-8 bg-gomo-gradient rounded-lg flex items-center justify-center text-white font-black text-sm">G</div>
                <div>
                  <h1 className="font-bold text-base tracking-tight">Growth Protocol <span className="text-slate-600 font-light mono text-xs">v2.4</span></h1>
                  <p className="text-[9px] text-slate-500 uppercase tracking-widest font-semibold">Strategy Dashboard \u2014 Launch Mode / Full Mode</p>
                </div>
              </div>
              <div className="flex items-center gap-1 bg-[#0a0e17] border border-white/5 rounded-lg p-1">
                {["ALL", "T1", "T2", "T3"].map(t => (
                  <button key={t} onClick={() => setTierFilter(t)} className={`px-3 py-1.5 rounded-md text-xs font-bold transition-all mono ${tierFilter === t ? (t === "ALL" ? "bg-white/10 text-white" : `${TIER_CONFIG[t]?.bg || ""} ${TIER_CONFIG[t]?.color || "text-white"}`) : "text-slate-500 hover:text-slate-300"}`}>
                    {t === "ALL" ? "All" : t} <span className="text-[10px] opacity-50 ml-1">{tierCounts[t]}</span>
                  </button>
                ))}
              </div>
            </div>
          </header>

          <div className="max-w-[1600px] mx-auto w-full flex-1 flex gap-0">
            {/* Sidebar */}
            <aside className="w-64 shrink-0 border-r border-white/5 overflow-y-auto custom-scrollbar" style={{maxHeight:"calc(100vh - 57px)"}}>
              <div className="p-3 space-y-4">
                {CATEGORIES.map(cat => {
                  const items = filtered.filter(s => s.category === cat);
                  if (!items.length) return null;
                  return (
                    <div key={cat}>
                      <p className="text-[8px] font-black uppercase text-slate-600 tracking-[0.2em] mb-1.5 px-2">{cat} \u00B7 {CAT_LABELS[cat]}</p>
                      <div className="space-y-0.5">
                        {items.map(s => (
                          <button key={s.id} onClick={() => setSelectedId(s.id)} className={`w-full group px-2.5 py-2 rounded-lg text-left transition-all flex items-center gap-2 ${selectedId === s.id ? `${s.bgColor} border-l-2 ${s.borderColor}` : "hover:bg-white/3"}`}>
                            <s.icon className={`w-3 h-3 shrink-0 ${selectedId === s.id ? s.color : "text-slate-600"}`} />
                            <span className={`text-[12px] font-medium truncate flex-1 ${selectedId === s.id ? "text-white" : "text-slate-400"}`}>{s.title}</span>
                            <TierBadge tier={s.tier} />
                          </button>
                        ))}
                      </div>
                    </div>
                  );
                })}
              </div>
            </aside>

            {/* Main */}
            <main className="flex-1 overflow-y-auto custom-scrollbar p-5 space-y-5" style={{maxHeight:"calc(100vh - 57px)"}}>
              {selected && (
                <div className="animate-in space-y-5">
                  {/* Title */}
                  <div className="flex items-center gap-3">
                    <div className={`w-10 h-10 rounded-xl ${selected.bgColor} border ${selected.borderColor} flex items-center justify-center`}>
                      <selected.icon className={`w-5 h-5 ${selected.color}`} />
                    </div>
                    <div className="flex-1">
                      <div className="flex items-center gap-2 flex-wrap">
                        <h2 className="text-xl font-bold tracking-tight">{selected.title}</h2>
                        <TierBadge tier={selected.tier} />
                        <span className="text-[9px] uppercase tracking-widest text-slate-500 font-bold">{selected.category} \u00B7 {CAT_LABELS[selected.category]}</span>
                      </div>
                      <p className="text-[13px] text-slate-400 mt-0.5">{selected.summary}</p>
                    </div>
                  </div>

                  {/* Launch Mode / Full Mode */}
                  <div className="grid md:grid-cols-2 gap-4">
                    <div className={`bg-[#0d1220] border rounded-xl p-5 space-y-3 ${selected.tier === "T1" ? "border-cyan-500/10" : selected.tier === "T2" ? "border-amber-500/10" : "border-slate-500/10"}`}>
                      <div className="flex items-center gap-2">
                        <ModeBadge mode="launch" />
                        <span className="text-[9px] font-black uppercase text-slate-500 tracking-widest">
                          {selected.tier === "T1" ? "Ships standalone \u2014 generates foundational data" : selected.tier === "T2" ? "Ships in lite mode \u2014 performs best with T1 data" : "Ships as MVP \u2014 requires ecosystem for full potential"}
                        </span>
                      </div>
                      <p className="text-sm text-slate-200 leading-relaxed">{selected.launchMode}</p>
                    </div>
                    <div className="bg-[#0d1220] border border-violet-500/10 rounded-xl p-5 space-y-3">
                      <div className="flex items-center gap-2">
                        <ModeBadge mode="full" />
                        <span className="text-[9px] font-black uppercase text-slate-500 tracking-widest">Enhanced by ecosystem connections</span>
                      </div>
                      <p className="text-sm text-slate-200 leading-relaxed">{selected.fullMode}</p>
                    </div>
                  </div>

                  {/* Why This Tier */}
                  {selected.whyTier && (
                    <div className={`bg-[#0d1220] border rounded-xl p-4 flex items-start gap-3 ${selected.tier === "T1" ? "border-emerald-500/15" : selected.tier === "T2" ? "border-amber-500/15" : "border-slate-500/15"}`}>
                      <div className="shrink-0 mt-0.5">
                        <TierBadge tier={selected.tier} />
                      </div>
                      <div className="flex-1">
                        <p className={`text-[9px] font-black uppercase tracking-widest mb-1 ${selected.tier === "T1" ? "text-emerald-400" : selected.tier === "T2" ? "text-amber-400" : "text-slate-400"}`}>
                          Why {selected.tier} \u2014 {TIER_CONFIG[selected.tier].desc}
                        </p>
                        <p className="text-[13px] text-slate-300 leading-relaxed">{selected.whyTier}</p>
                      </div>
                    </div>
                  )}

                  {/* Synergy Map */}
                  <div className="bg-[#0d1220] border border-white/5 rounded-xl p-5">
                    <div className="grid grid-cols-[1fr_auto_1fr] gap-5 items-start min-h-[240px]">
                      <div>
                        <p className="text-[8px] font-black text-slate-500 uppercase tracking-[0.15em] mb-2 flex items-center gap-1"><Zap className="w-2.5 h-2.5" /> Inputs</p>
                        <div className="space-y-1">
                          {selected.connections.inputs.length === 0 ? (
                            <div className="text-[9px] text-slate-700 font-bold uppercase italic border border-dashed border-slate-800 p-3 rounded-lg text-center">Foundational Node</div>
                          ) : selected.connections.inputs.map(id => { const sys = getSystem(id); if (!sys) return null; return (
                            <button key={id} onClick={() => setSelectedId(id)} className="w-full p-2 rounded-lg bg-white/2 border border-white/5 flex items-center gap-2 hover:bg-white/5 transition-colors text-left">
                              <sys.icon className={`w-3 h-3 ${sys.color} shrink-0`} />
                              <span className="text-[11px] font-medium text-slate-300 flex-1 truncate">{sys.title}</span>
                              <TierBadge tier={sys.tier} />
                            </button>
                          ); })}
                        </div>
                      </div>
                      <div className="flex items-center justify-center pt-6">
                        <div className={`w-36 h-36 rounded-full ${selected.bgColor} border-2 ${selected.borderColor} flex flex-col items-center justify-center text-center gap-1 shadow-xl`}>
                          <selected.icon className={`w-8 h-8 ${selected.color}`} />
                          <span className="font-black text-[11px] uppercase tracking-tight text-white px-2">{selected.title}</span>
                          <TierBadge tier={selected.tier} />
                        </div>
                      </div>
                      <div>
                        <p className="text-[8px] font-black text-slate-500 uppercase tracking-[0.15em] mb-2 text-right flex items-center justify-end gap-1">Outputs <Zap className="w-2.5 h-2.5" /></p>
                        <div className="space-y-1">
                          {selected.connections.outputs.length === 0 ? (
                            <div className="text-[9px] text-slate-700 font-bold uppercase italic border border-dashed border-slate-800 p-3 rounded-lg text-center">Terminal Node</div>
                          ) : selected.connections.outputs.map(id => { const sys = getSystem(id); if (!sys) return null; return (
                            <button key={id} onClick={() => setSelectedId(id)} className="w-full p-2 rounded-lg bg-white/2 border border-white/5 flex flex-row-reverse items-center gap-2 hover:bg-white/5 transition-colors text-right">
                              <sys.icon className={`w-3 h-3 ${sys.color} shrink-0`} />
                              <span className="text-[11px] font-medium text-slate-300 flex-1 truncate">{sys.title}</span>
                              <TierBadge tier={sys.tier} />
                            </button>
                          ); })}
                        </div>
                      </div>
                    </div>
                  </div>

                  {/* Hook Model + Kill Criteria */}
                  <div className="grid md:grid-cols-2 gap-4">
                    <div className="bg-[#0d1220] border border-white/5 rounded-xl p-5 space-y-4">
                      <h4 className="text-[9px] font-black uppercase text-slate-500 tracking-[0.15em] border-b border-white/5 pb-2">Hook Model</h4>
                      {[{ n:"01", l:"Trigger", v:selected.loop.trigger }, { n:"02", l:"Action", v:selected.loop.action }, { n:"03", l:"Reward", v:selected.loop.reward }].map(s => (
                        <div key={s.n} className="flex gap-2.5">
                          <div className={`w-6 h-6 rounded-md border ${selected.borderColor} bg-[#0a0e17] flex items-center justify-center shrink-0`}>
                            <span className="text-[8px] font-black text-white mono">{s.n}</span>
                          </div>
                          <div><p className="text-[8px] font-black uppercase text-slate-500 mb-0.5">{s.l}</p><p className="text-[13px] text-slate-200">{s.v}</p></div>
                        </div>
                      ))}
                      <div className="pt-3 border-t border-white/5 flex gap-2.5">
                        <Target className="w-3.5 h-3.5 text-pink-400 shrink-0 mt-0.5" />
                        <div><p className="text-[8px] font-black uppercase text-pink-400 tracking-widest mb-0.5">Strategic Investment</p><p className="text-[13px] text-slate-400 italic">{selected.loop.investment}</p></div>
                      </div>
                    </div>
                    <div className="bg-[#0d1220] border border-red-500/10 rounded-xl p-5 space-y-4">
                      <h4 className="text-[9px] font-black uppercase text-red-400 tracking-[0.15em] border-b border-red-500/10 pb-2 flex items-center gap-1.5"><XCircle className="w-3 h-3" /> Kill Criteria</h4>
                      <div><p className="text-[8px] font-black uppercase text-slate-500 mb-0.5">Success Metric</p><p className="text-[13px] text-slate-200">{selected.killCriteria.metric}</p></div>
                      <div><p className="text-[8px] font-black uppercase text-slate-500 mb-0.5">Target</p><p className="text-[13px] text-emerald-400 font-medium">{selected.killCriteria.target}</p></div>
                      <div><p className="text-[8px] font-black uppercase text-slate-500 mb-0.5">Review Deadline</p><p className="text-[13px] text-amber-400 font-medium mono">{selected.killCriteria.deadline}</p></div>
                      <div className="pt-3 border-t border-red-500/10"><p className="text-[8px] font-black uppercase text-red-400 tracking-widest mb-0.5">If Target Not Met</p><p className="text-[13px] text-slate-400">{selected.killCriteria.action}</p></div>
                    </div>
                  </div>

                  {/* Legend */}
                  <div className="bg-[#0d1220] border border-white/5 rounded-lg px-5 py-2.5 flex items-center gap-6 flex-wrap">
                    <span className="text-[8px] font-black uppercase text-slate-600 tracking-widest">Tiers</span>
                    {Object.entries(TIER_CONFIG).map(([k,v]) => (<div key={k} className="flex items-center gap-1.5"><TierBadge tier={k} /><span className="text-[10px] text-slate-500">{v.desc}</span></div>))}
                    <span className="text-[8px] font-black uppercase text-slate-600 tracking-widest ml-4">Modes</span>
                    <div className="flex items-center gap-1.5"><ModeBadge mode="launch" /><span className="text-[10px] text-slate-500">Launchable (performance varies by tier)</span></div>
                    <div className="flex items-center gap-1.5"><ModeBadge mode="full" /><span className="text-[10px] text-slate-500">Fully connected to ecosystem</span></div>
                    <span className="text-[9px] text-slate-600 ml-auto mono">{filtered.length}/{growthSystems.length} visible</span>
                  </div>
                </div>
              )}
            </main>
          </div>
          <GlobalDock />
        </div>
      );
    }

    /* ── Maintenance View ── */
    const MaintenanceView = ({ onBack }) => (
      <div className="min-h-screen flex flex-col items-center justify-center bg-[#0a0e17] relative overflow-hidden text-center px-6">
        <div className="absolute inset-0 bg-[linear-gradient(to_right,#80808008_1px,transparent_1px),linear-gradient(to_bottom,#80808008_1px,transparent_1px)] bg-[size:24px_24px]"></div>
        <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-gomo-gradient opacity-15 blur-[120px] rounded-full"></div>
        <div className="relative z-10 space-y-8 max-w-lg mx-auto">
          <div className="w-20 h-20 bg-[#0d1220] border border-white/10 rounded-2xl flex items-center justify-center mx-auto shadow-2xl relative group">
            <div className="absolute inset-0 bg-gomo-gradient opacity-20 rounded-2xl blur-md group-hover:opacity-40 transition-opacity"></div>
            <Hammer className="w-8 h-8 text-white relative z-10 animate-bounce" />
          </div>
          <div className="space-y-3">
            <h1 className="text-4xl font-black text-white tracking-tighter">System <span className="text-gomo-gradient">Maintenance</span></h1>
            <p className="text-slate-400 text-base font-medium leading-relaxed">The Growth Protocol Engine is undergoing scheduled upgrades to optimize ecosystem performance.</p>
          </div>
          <div className="bg-[#0d1220] border border-white/10 rounded-xl p-5 max-w-sm mx-auto">
            <div className="flex justify-between items-center text-[9px] font-bold text-slate-500 uppercase tracking-widest mb-2">
              <span>Optimization Progress</span>
              <span className="gomo-pink animate-pulse">Processing...</span>
            </div>
            <div className="w-full h-1 bg-slate-800 rounded-full overflow-hidden">
              <div className="h-full bg-gomo-gradient w-2/3 animate-[pulse_2s_cubic-bezier(0.4,0,0.6,1)_infinite]"></div>
            </div>
            <p className="text-[9px] text-slate-600 mt-2 mono">ESTIMATED DURATION: <button onClick={onBack} className="hover:text-pink-400 underline decoration-dotted transition-colors cursor-pointer font-bold">2</button> HOURS</p>
          </div>
        </div>
      </div>
    );

    createRoot(document.getElementById("root")).render(<Dashboard />);
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Growth Protocol - Maintenance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Outfit", sans-serif;
      }
      .mono {
        font-family: "JetBrains Mono", monospace;
      }
      .bg-gomo-gradient {
        background-image: linear-gradient(135deg, #8a2be2, #ff1493);
      }
      .text-gomo-gradient {
        background-image: linear-gradient(to right, #8a2be2, #ff1493);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .gomo-pink {
        color: #ff1493;
      }
    </style>
  </head>
  <body class="bg-[#0a0e17] text-slate-100 antialiased">
    <div
      class="min-h-screen flex flex-col items-center justify-center bg-[#0a0e17] relative overflow-hidden text-center px-6"
    >
      <div
        class="absolute inset-0 bg-[linear-gradient(to_right,#80808008_1px,transparent_1px),linear-gradient(to_bottom,#80808008_1px,transparent_1px)] bg-[size:24px_24px]"
      ></div>
      <div
        class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-gomo-gradient opacity-15 blur-[120px] rounded-full"
      ></div>
      <div class="relative z-10 space-y-8 max-w-lg mx-auto">
        <div
          class="w-20 h-20 bg-[#0d1220] border border-white/10 rounded-2xl flex items-center justify-center mx-auto shadow-2xl relative group"
        >
          <div
            class="absolute inset-0 bg-gomo-gradient opacity-20 rounded-2xl blur-md group-hover:opacity-40 transition-opacity"
          ></div>
          <svg
            class="w-8 h-8 text-white relative z-10 animate-bounce"
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="m15 12-9.373 9.373a1 1 0 0 1-3.001-3L12 9" />
            <path d="m18 15 4-4" />
            <path
              d="m21.5 11.5-1.914-1.914A2 2 0 0 1 19 8.172v-.344a2 2 0 0 0-.586-1.414l-1.657-1.657A6 6 0 0 0 12.516 3H9l1.243 1.243A6 6 0 0 1 12 8.485V10l2 2h1.172a2 2 0 0 1 1.414.586L18.5 14.5"
            />
          </svg>
        </div>
        <div class="space-y-3">
          <h1 class="text-4xl font-black text-white tracking-tighter">
            System <span class="text-gomo-gradient">Maintenance</span>
          </h1>
          <p class="text-slate-400 text-base font-medium leading-relaxed">
            The Growth Protocol Engine is undergoing scheduled upgrades to
            optimize ecosystem performance.
          </p>
        </div>
        <div
          class="bg-[#0d1220] border border-white/10 rounded-xl p-5 max-w-sm mx-auto"
        >
          <div
            class="flex justify-between items-center text-[9px] font-bold text-slate-500 uppercase tracking-widest mb-2"
          >
            <span>Optimization Progress</span>
            <span class="gomo-pink animate-pulse">Processing...</span>
          </div>
          <div class="w-full h-1 bg-slate-800 rounded-full overflow-hidden">
            <div
              class="h-full bg-gomo-gradient w-2/3 animate-[pulse_2s_cubic-bezier(0.4,0,0.6,1)_infinite]"
            ></div>
          </div>
          <p class="text-[9px] text-slate-600 mt-2 mono">
            ESTIMATED DURATION:
            <button
              onclick="window.location.href='home.html';"
              class="hover:text-pink-400 underline decoration-dotted transition-colors cursor-pointer font-bold"
            >
              2
            </button>
            HOURS
          </p>
        </div>
      </div>
    </div>
  </body>
</html>

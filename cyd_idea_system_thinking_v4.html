                                <span className={`inline-block px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider mb-2 border ${selectedSystem.borderColor} ${selectedSystem.color} bg-black/40`}>Active System</span>
                                <h2 className="text-2xl font-bold text-white leading-tight mb-1">{selectedSystem.title}</h2>
                                <p className="text-xs text-slate-400 max-w-[150px] mx-auto">{selectedSystem.category} Engine</p>
                              </div>
                            </div>
                            <div className="lg:hidden mt-4"><ChevronsRight className="w-8 h-8 text-slate-600 rotate-90" /></div>
                          </div>

                          {/* OUTPUTS COLUMN */}
                          <div className="flex-1 w-full flex flex-col justify-center gap-4">
                            <div className="flex items-center justify-end gap-2 text-xs font-bold text-slate-500 uppercase mb-2 pr-1">Fuels (Outputs) <Zap className="w-3 h-3" /></div>
                            {selectedSystem.connections.outputs.filter(id => getVisibleSystem(id)).length === 0 ? (
                              <div className="p-6 rounded-2xl border border-dashed border-slate-700 bg-slate-900/50 text-slate-500 text-sm text-center italic">
                                {!showFullEcosystem ? "Outputs hidden in Core View" : "This is a terminal value node."}
                                <br />
                                {!showFullEcosystem ? "Toggle Full View to see downstream." : "It retains the user indefinitely."}
                              </div>
                            ) : (
                              selectedSystem.connections.outputs.map((outputId) => {
                                const sys = getVisibleSystem(outputId);
                                if (!sys) return null;
                                return (
                                  <button key={sys.id} onClick={() => setSelectedSystemId(sys.id)} className="group relative p-5 rounded-xl border border-slate-700 bg-slate-800/50 hover:border-slate-500 hover:bg-slate-800 transition-all text-right shadow-lg hover:shadow-xl flex flex-row-reverse items-center gap-4 w-full hover:-translate-y-1">
                                    <div className={`p-3 rounded-lg bg-slate-900 border border-slate-700 ${sys.color}`}><sys.icon className="w-6 h-6" /></div>
                                    <div><span className="text-xs text-slate-400 uppercase font-semibold tracking-wider">Powers</span><h4 className="font-bold text-slate-200 group-hover:text-white text-lg leading-tight">{sys.title}</h4></div>
                                    <div className="absolute -left-3 top-1/2 -translate-y-1/2 w-6 h-6 bg-slate-900 border border-slate-600 rounded-full flex items-center justify-center z-20"><ArrowRight className="w-3 h-3 text-slate-400" /></div>
                                  </button>
                                );
                              })
                            )}
                          </div>
                        </div>
                      </div>
                    </div>
                    )}

                    {/* HOOK MODEL */}
                    {selectedSystem && (
                    <div className="grid md:grid-cols-2 gap-6">
                      <div className={`p-8 rounded-3xl border border-slate-800 ${selectedSystem.bgColor} flex flex-col justify-center`}>
                        <div className="flex items-center gap-3 mb-4"><span className={`px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider bg-black/20 border border-white/10 text-white`}>{selectedSystem.category} Loop</span></div>
                        <h2 className="text-3xl font-bold text-white mb-4">{selectedSystem.title}</h2>
                        <p className="text-slate-200 text-lg leading-relaxed opacity-90">{selectedSystem.summary}</p>
                      </div>
                      <div className="bg-slate-900 border border-slate-800 rounded-3xl p-8 flex flex-col justify-center space-y-6">
                        <div className="flex gap-4"><div className={`mt-1 w-6 h-6 rounded-full border-2 ${selectedSystem.borderColor} bg-slate-950 flex items-center justify-center shrink-0`}><span className="text-[10px] font-bold">1</span></div><div><h4 className="text-xs font-bold uppercase text-slate-500">Trigger</h4><p className="text-slate-300">{selectedSystem.loop.trigger}</p></div></div>
                        <div className="flex gap-4"><div className={`mt-1 w-6 h-6 rounded-full border-2 ${selectedSystem.borderColor} bg-slate-950 flex items-center justify-center shrink-0`}><span className="text-[10px] font-bold">2</span></div><div><h4 className="text-xs font-bold uppercase text-slate-500">Action</h4><p className="text-slate-300">{selectedSystem.loop.action}</p></div></div>
                        <div className="flex gap-4"><div className={`mt-1 w-6 h-6 rounded-full border-2 ${selectedSystem.borderColor} bg-slate-950 flex items-center justify-center shrink-0`}><span className="text-[10px] font-bold">3</span></div><div><h4 className="text-xs font-bold uppercase text-slate-500">Variable Reward</h4><p className="text-slate-300">{selectedSystem.loop.reward}</p></div></div>
                        <div className="flex gap-4"><div className={`mt-1 w-6 h-6 rounded-full border-2 ${selectedSystem.borderColor} bg-slate-950 flex items-center justify-center shrink-0`}><span className="text-[10px] font-bold">4</span></div><div><h4 className="text-xs font-bold uppercase text-slate-500">Investment</h4><p className="text-white font-medium">{selectedSystem.loop.investment}</p></div></div>
                      </div>
                    </div>
                    )}
                  </div>
                </div>
                )}
            </main>
          </div>
        );
      }

      const root = createRoot(document.getElementById("root"));
      root.render(<GrowthSystemDashboard />);
    </script>
  </body>
</html>

          100% { box-shadow: 0 0 0 0 rgba(255, 20, 147, 0); }

          background-position: center;
          overflow: hidden;

          position: absolute;
          inset: 0;
          background: radial-gradient(circle at center, transparent 30%, rgba(2, 6, 23, 0.4) 100%);

      }

          height: 2px;

                        Partner Co-Pilot
                      </button>
                      <button 
                        onClick={() => setViewMode("drops")}
                        className={`px-4 py-1.5 rounded-lg text-xs font-bold uppercase tracking-wide transition-all ${
                          viewMode === "drops"
                            ? "bg-gomo-gradient text-white shadow-md"
                            : "text-slate-500 hover:text-slate-300"
                        }`}
                      >
                        Digital Drops
                      </button>
                  </div>
                </div>
                
                {/* Right Actions */}
                <div className="flex items-center gap-4">
                  {viewMode === "architecture" && (
                    <div className="flex items-center gap-4">
                      <span
                        className={`text-xs font-bold uppercase tracking-wide transition-colors ${
                          !showFullEcosystem ? "text-white" : "text-slate-500"
                        }`}
                      >
                        Core Loop
                      </span>
                      <button
                        onClick={() => setShowFullEcosystem(!showFullEcosystem)}
                        className="relative w-12 h-6 rounded-full bg-slate-800 border border-slate-600 transition-colors focus:outline-none"
                      >
                        <div
                          className={`absolute top-1 left-1 w-4 h-4 rounded-full shadow-md transition-all duration-300 transform ${
                            showFullEcosystem
                              ? "translate-x-6 bg-cyan-500"
                              : "translate-x-0 bg-yellow-400"
                          }`}
                        ></div>
                      </button>
                      <span
                        className={`text-xs font-bold uppercase tracking-wide transition-colors ${
                          showFullEcosystem ? "text-white" : "text-slate-500"
                        }`}
                      >
                        Full View
                      </span>
                    </div>
                  )}
                  {viewMode === "partner" && (
                    <div className="flex items-center gap-2 px-3 py-1.5 rounded-full border border-gomo-purple/30 bg-purple-900/20">
                      <div className="w-2 h-2 rounded-full bg-gomo-pink animate-pulse"></div>
                      <span className="text-[10px] font-bold text-gomo-purple uppercase tracking-widest">
                        B2B Engine Active
                      </span>
                    </div>
                  )}
                   {viewMode === "drops" && (
                    <div className="flex items-center gap-2 px-3 py-1.5 rounded-full border border-blue-500/30 bg-blue-900/20">
                      <div className="w-2 h-2 rounded-full bg-blue-400 animate-pulse"></div>
                      <span className="text-[10px] font-bold text-blue-400 uppercase tracking-widest">
                        AR Active
                      </span>
                    </div>
                  )}
                </div>
              </div>
            </header>

            <main className="flex-1 max-w-[1600px] mx-auto w-full p-6">
              {viewMode === "partner" ? (
                <PartnerCoPilotView />
              ) : viewMode === "drops" ? (
                <DigitalDropsView />
              ) : (
                /* --- VIEW: ARCHITECTURE (Default) --- */
                <div className="grid lg:grid-cols-12 gap-8 items-start h-full">
                  {/* LEFT COLUMN: Sidebar Navigation */}
                  <div className="lg:col-span-4 space-y-6 lg:sticky lg:top-24 h-full overflow-y-auto pr-2 custom-scrollbar">
                    <div className="prose prose-invert max-w-none mb-4">
                      <h2 className="text-xl font-light">
                        {showFullEcosystem
                          ? "Full Ecosystem"
                          : "Core Growth Loop"}
                      </h2>
                      <p className="text-sm text-slate-400">
                        Select a component to inspect its{" "}
                        <span className="text-cyan-400 font-medium">
                          Causal Loop
                        </span>
                        .
                      </p>
                    </div>

                    <div className="space-y-8">
                      {categories.map((cat) => {
                        const systemsInCategory = visibleSystems.filter((s) =>
                          s.category.startsWith(cat)
                        );

                        if (systemsInCategory.length === 0) return null;

                        return (
                          <div key={cat} className="space-y-3 animate-fade-in">
                            <div className="flex items-center gap-3 text-xs font-bold uppercase tracking-wider text-slate-500">
                              <span className="w-8 h-[1px] bg-slate-700"></span>
                              {cat}
                              <span className="flex-1 h-[1px] bg-slate-700"></span>
                            </div>
                            <div className="grid grid-cols-1 gap-2">
                              {systemsInCategory.map((system) => (
                                <button
                                  key={system.id}
                                  onClick={() => setSelectedSystemId(system.id)}
                                  className={`
                                    relative group px-4 py-3 rounded-lg border text-left transition-all duration-200 flex items-center gap-3
                                    ${
                                      selectedSystemId === system.id
                                        ? `${system.bgColor} ${system.borderColor} border-l-4 translate-x-1 shadow-lg`
                                        : "bg-slate-900 border-slate-800 hover:border-slate-600 hover:bg-slate-800"
                                    }
                                  `}
                                >
                                  <system.icon
                                    className={`w-5 h-5 shrink-0 ${
                                      selectedSystemId === system.id
                                        ? system.color
                                        : "text-slate-500 group-hover:text-slate-300"
                                    }`}
                                  />
                                  <div className="min-w-0">
                                    <h3
                                      className={`font-semibold text-sm truncate ${
                                        selectedSystemId === system.id
                                          ? "text-white"
                                          : "text-slate-300"
                                      }`}
                                    >
                                      {system.title}
                                    </h3>
                                  </div>
                                  {selectedSystemId === system.id && (
                                    <ArrowRight className="w-4 h-4 text-white ml-auto" />
                                  )}
                                </button>
                              ))}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>

                  {/* RIGHT COLUMN: The Main Stage */}
                  <div className="lg:col-span-8 space-y-8 animate-fade-in">
                    {selectedSystem && (
                      <div className="bg-slate-900 border border-slate-700 rounded-3xl p-8 relative overflow-hidden shadow-2xl">
                        <div className="absolute inset-0 bg-[linear-gradient(to_right,#80808012_1px,transparent_1px),linear-gradient(to_bottom,#80808012_1px,transparent_1px)] bg-[size:24px_24px] pointer-events-none"></div>
                        <div className="absolute top-0 right-0 p-32 bg-cyan-500/10 blur-[100px] rounded-full pointer-events-none"></div>

                        <div className="relative z-10">
                          <div className="flex items-center gap-3 mb-10 border-b border-slate-700 pb-6">
                            <div className="p-2 bg-slate-800 rounded-lg border border-slate-600">
                              <Network className="w-6 h-6 text-cyan-400" />
                            </div>
                            <div>
                              <h3 className="font-bold text-white text-xl uppercase tracking-wide">
                                System Synergy Map
                              </h3>
                              <p className="text-sm text-slate-400">
                                Visualizing how{" "}
                                <span className="text-white font-semibold">
                                  {selectedSystem.title}
                                </span>{" "}
                                integrates into the{" "}
                                {showFullEcosystem ? "ecosystem" : "core loop"}.
                              </p>
                            </div>
                          </div>

                          <div className="flex flex-col lg:flex-row items-center lg:items-stretch justify-between gap-8 lg:gap-12 min-h-[400px]">
                            {/* INPUTS COLUMN */}
                            <div className="flex-1 w-full flex flex-col justify-center gap-4">
                              <div className="flex items-center gap-2 text-xs font-bold text-slate-500 uppercase mb-2 pl-1">
                                <Zap className="w-3 h-3" /> Powered By (Inputs)
                              </div>

                              {selectedSystem.connections.inputs.filter((id) =>
                                getVisibleSystem(id)
                              ).length === 0 ? (
                                <div className="p-6 rounded-2xl border border-dashed border-slate-700 bg-slate-900/50 text-slate-500 text-sm text-center italic">
                                  {!showFullEcosystem
                                    ? "Inputs hidden in Core View"
                                    : "This system is a foundational layer."}
                                  <br />
                                  {!showFullEcosystem
                                    ? "Toggle Full View to see sources."
                                    : "It initiates the loop."}
                                </div>
                              ) : (
                                selectedSystem.connections.inputs.map(
                                  (inputId) => {
                                    const sys = getVisibleSystem(inputId);
                                    if (!sys) return null;
                                    return (
                                      <button
                                        key={sys.id}
                                        onClick={() =>
                                          setSelectedSystemId(sys.id)
                                        }
                                        className="group relative p-5 rounded-xl border border-slate-700 bg-slate-800/50 hover:border-slate-500 hover:bg-slate-800 transition-all text-left shadow-lg hover:shadow-xl flex items-center gap-4 w-full hover:-translate-y-1"
                                      >
                                        <div
                                          className={`p-3 rounded-lg bg-slate-900 border border-slate-700 ${sys.color}`}
                                        >
                                          <sys.icon className="w-6 h-6" />
                                        </div>
                                        <div>
                                          <span className="text-xs text-slate-400 uppercase font-semibold tracking-wider">
                                            Feeds In
                                          </span>
                                          <h4 className="font-bold text-slate-200 group-hover:text-white text-lg leading-tight">
                                            {sys.title}
                                          </h4>
                                        </div>
                                        <div className="absolute -right-3 top-1/2 -translate-y-1/2 w-6 h-6 bg-slate-900 border border-slate-600 rounded-full flex items-center justify-center z-20">
                                          <ArrowRight className="w-3 h-3 text-slate-400" />
                                        </div>
                                      </button>
                                    );
                                  }
                                )
                              )}
                            </div>

                            {/* CENTER NODE */}
                            <div className="w-full lg:w-1/3 shrink-0 flex flex-col justify-center items-center relative py-8">
                              <div className="absolute top-1/2 left-[-50px] right-[-50px] h-1 bg-gradient-to-r from-transparent via-slate-600 to-transparent -z-10 hidden lg:block"></div>
                              <div
                                className={`absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-48 h-48 rounded-full ${selectedSystem.bgColor.replace(
                                  "/30",
                                  ""
                                )} blur-[60px] opacity-40 animate-pulse`}
                              ></div>
                              <div
                                className={`relative z-20 w-full aspect-square max-w-[280px] p-6 rounded-3xl border-2 ${selectedSystem.borderColor} bg-slate-900 flex flex-col items-center justify-center gap-4 shadow-[0_0_50px_rgba(0,0,0,0.5)] transition-all duration-500`}
                              >
                                <div
                                  className={`p-4 rounded-2xl ${selectedSystem.bgColor} border border-white/10`}
                                >
                                  <selectedSystem.icon
                                    className={`w-16 h-16 ${selectedSystem.color}`}
                                  />
                                </div>
                                <div className="text-center">
                                  <span
                                    className={`inline-block px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider mb-2 border ${selectedSystem.borderColor} ${selectedSystem.color} bg-black/40`}
                                  >
                                    Active System
                                  </span>
                                  <h2 className="text-2xl font-bold text-white leading-tight mb-1">
                                    {selectedSystem.title}
                                  </h2>
                                  <p className="text-xs text-slate-400 max-w-[150px] mx-auto">
                                    {selectedSystem.category} Engine
                                  </p>
                                </div>
                              </div>
                              <div className="lg:hidden mt-4">
                                <ChevronsRight className="w-8 h-8 text-slate-600 rotate-90" />
                              </div>
                            </div>

                            {/* OUTPUTS COLUMN */}
                            <div className="flex-1 w-full flex flex-col justify-center gap-4">
                              <div className="flex items-center justify-end gap-2 text-xs font-bold text-slate-500 uppercase mb-2 pr-1">
                                Fuels (Outputs) <Zap className="w-3 h-3" />
                              </div>
                              {selectedSystem.connections.outputs.filter((id) =>
                                getVisibleSystem(id)
                              ).length === 0 ? (
                                <div className="p-6 rounded-2xl border border-dashed border-slate-700 bg-slate-900/50 text-slate-500 text-sm text-center italic">
                                  {!showFullEcosystem
                                    ? "Outputs hidden in Core View"
                                    : "This is a terminal value node."}
                                  <br />
                                  {!showFullEcosystem
                                    ? "Toggle Full View to see downstream."
                                    : "It retains the user indefinitely."}
                                </div>
                              ) : (
                                selectedSystem.connections.outputs.map(
                                  (outputId) => {
                                    const sys = getVisibleSystem(outputId);
                                    if (!sys) return null;
                                    return (
                                      <button
                                        key={sys.id}
                                        onClick={() =>
                                          setSelectedSystemId(sys.id)
                                        }
                                        className="group relative p-5 rounded-xl border border-slate-700 bg-slate-800/50 hover:border-slate-500 hover:bg-slate-800 transition-all text-right shadow-lg hover:shadow-xl flex flex-row-reverse items-center gap-4 w-full hover:-translate-y-1"
                                      >
                                        <div
                                          className={`p-3 rounded-lg bg-slate-900 border border-slate-700 ${sys.color}`}
                                        >
                                          <sys.icon className="w-6 h-6" />
                                        </div>
                                        <div>
                                          <span className="text-xs text-slate-400 uppercase font-semibold tracking-wider">
                                            Powers
                                          </span>
                                          <h4 className="font-bold text-slate-200 group-hover:text-white text-lg leading-tight">
                                            {sys.title}
                                          </h4>
                                        </div>
                                        <div className="absolute -left-3 top-1/2 -translate-y-1/2 w-6 h-6 bg-slate-900 border border-slate-600 rounded-full flex items-center justify-center z-20">
                                          <ArrowRight className="w-3 h-3 text-slate-400" />
                                        </div>
                                      </button>
                                    );
                                  }
                                )
                              )}
                            </div>
                          </div>
                        </div>
                      </div>
                    )}

                    {/* HOOK MODEL */}
                    {selectedSystem && (
                      <div className="grid md:grid-cols-2 gap-6">
                        <div
                          className={`p-8 rounded-3xl border border-slate-800 ${selectedSystem.bgColor} flex flex-col justify-center`}
                        >
                          <div className="flex items-center gap-3 mb-4">
                            <span
                              className={`px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider bg-black/20 border border-white/10 text-white`}
                            >
                              {selectedSystem.category} Loop
                            </span>
                          </div>
                          <h2 className="text-3xl font-bold text-white mb-4">
                            {selectedSystem.title}
                          </h2>
                          <p className="text-slate-200 text-lg leading-relaxed opacity-90">
                            {selectedSystem.summary}
                          </p>
                        </div>
                        <div className="bg-slate-900 border border-slate-800 rounded-3xl p-8 flex flex-col justify-center space-y-6">
                          <div className="flex gap-4">
                            <div
                              className={`mt-1 w-6 h-6 rounded-full border-2 ${selectedSystem.borderColor} bg-slate-950 flex items-center justify-center shrink-0`}
                            >
                              <span className="text-[10px] font-bold">1</span>
                            </div>
                            <div>
                              <h4 className="text-xs font-bold uppercase text-slate-500">
                                Trigger
                              </h4>
                              <p className="text-slate-300">
                                {selectedSystem.loop.trigger}
                              </p>
                            </div>
                          </div>
                          <div className="flex gap-4">
                            <div
                              className={`mt-1 w-6 h-6 rounded-full border-2 ${selectedSystem.borderColor} bg-slate-950 flex items-center justify-center shrink-0`}
                            >
                              <span className="text-[10px] font-bold">2</span>
                            </div>
                            <div>
                              <h4 className="text-xs font-bold uppercase text-slate-500">
                                Action
                              </h4>
                              <p className="text-slate-300">
                                {selectedSystem.loop.action}
                              </p>
                            </div>
                          </div>
                          <div className="flex gap-4">
                            <div
                              className={`mt-1 w-6 h-6 rounded-full border-2 ${selectedSystem.borderColor} bg-slate-950 flex items-center justify-center shrink-0`}
                            >
                              <span className="text-[10px] font-bold">3</span>
                            </div>
                            <div>
                              <h4 className="text-xs font-bold uppercase text-slate-500">
                                Variable Reward
                              </h4>
                              <p className="text-slate-300">
                                {selectedSystem.loop.reward}
                              </p>
                            </div>
                          </div>
                          <div className="flex gap-4">
                            <div
                              className={`mt-1 w-6 h-6 rounded-full border-2 ${selectedSystem.borderColor} bg-slate-950 flex items-center justify-center shrink-0`}
                            >
                              <span className="text-[10px] font-bold">4</span>
                            </div>
                            <div>
                              <h4 className="text-xs font-bold uppercase text-slate-500">
                                Investment
                              </h4>
                              <p className="text-white font-medium">
                                {selectedSystem.loop.investment}
                              </p>
                            </div>
                          </div>
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              )}
            </main>

            {/* Footer with Maintenance Toggle */}
            <footer className="border-t border-slate-800 bg-slate-900/50 py-6 px-6">
              <div className="max-w-[1600px] mx-auto flex justify-between items-center text-[10px] text-slate-500 font-bold uppercase tracking-widest">
                <div className="flex items-center gap-2">
                  <div className="w-1.5 h-1.5 rounded-full bg-emerald-500"></div>
                  <span>System Status: All Systems Operational</span>
                </div>
                <button
                  onClick={() => setMaintenanceMode(true)}
                  className="hover:text-slate-300 transition-colors"
                >
                  Simulate Maintenance
                </button>
              </div>
            </footer>
          </div>
        );
      }

      const root = createRoot(document.getElementById("root"));
      root.render(<GrowthSystemDashboard />);
    </script>
  </body>
</html>
